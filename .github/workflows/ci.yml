name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Same hooks as the local pre-commit hook, run again here so a `--no-verify`
  # commit (or a contributor who never ran `pre-commit install`) can't skip
  # hygiene/secret-scanning checks and still merge.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # One job per service, each a no-op until that service has real source and
  # a manifest file (go.mod / pyproject.toml / package.json) to key off of.
  # This keeps the workflow honest about what's actually tested today instead
  # of hardcoding `go test ./...` against directories that don't build yet.
  #
  # A real Postgres and Redis run as service containers so integration tests
  # actually execute here, not just skip: locally they skip when their
  # DATABASE_URL/REDIS_URL env vars are unset (see e.g.
  # conduit-ledger/internal/ledger/repository_test.go), which is correct for
  # a laptop with nothing running locally, but would make this job silently
  # useless if CI didn't provide them.
  test-go-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        service: [conduit-core, conduit-ledger, conduit-webhooks, conduit-billing]
    steps:
      - uses: actions/checkout@v4
      - name: Check for go.mod
        id: check
        run: |
          if [ -f "services/${{ matrix.service }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - name: Migrate and test
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            conduit-core) export CORE_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-ledger) export LEDGER_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-webhooks) export WEBHOOKS_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-billing) export BILLING_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
          esac
          export INTERNAL_JWT_SECRET="ci-test-secret-not-real"
          export REDIS_URL="redis://localhost:6379"
          export CONDUIT_LEDGER_URL="http://localhost:8002"
          export CONDUIT_WEBHOOKS_URL="http://localhost:8003"
          if [ -d cmd/migrate ]; then go run ./cmd/migrate; fi
          go test ./... -race -cover

  test-risk-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for pyproject.toml
        id: check
        run: |
          if [ -f "services/conduit-risk/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: services/conduit-risk
        run: |
          pip install -e ".[dev]"
          pytest

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check
        run: |
          if [ -f "services/conduit-dashboard/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/conduit-dashboard/package-lock.json
      - name: npm test
        if: steps.check.outputs.exists == 'true'
        working-directory: services/conduit-dashboard
        run: |
          npm ci
          npm test
