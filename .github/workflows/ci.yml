name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Same hooks as the local pre-commit hook, run again here so a `--no-verify`
  # commit (or a contributor who never ran `pre-commit install`) can't skip
  # hygiene/secret-scanning checks and still merge.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # One job per service, each a no-op until that service has real source and
  # a manifest file (go.mod / pyproject.toml / package.json) to key off of.
  # This keeps the workflow honest about what's actually tested today instead
  # of hardcoding `go test ./...` against directories that don't build yet.
  #
  # A real Postgres and Redis run as service containers so integration tests
  # actually execute here, not just skip: locally they skip when their
  # DATABASE_URL/REDIS_URL env vars are unset (see e.g.
  # conduit-ledger/internal/ledger/repository_test.go), which is correct for
  # a laptop with nothing running locally, but would make this job silently
  # useless if CI didn't provide them.
  test-go-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      # fail-fast: false — these are independent services; one failing
      # shouldn't cancel the others mid-run and hide their real results.
      fail-fast: false
      matrix:
        service: [conduit-core, conduit-ledger, conduit-webhooks, conduit-billing]
    steps:
      - uses: actions/checkout@v4
      - name: Check for go.mod
        id: check
        run: |
          if [ -f "services/${{ matrix.service }}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.check.outputs.exists == 'true'
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
      - name: Migrate and test
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          case "${{ matrix.service }}" in
            conduit-core) export CORE_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-ledger) export LEDGER_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-webhooks) export WEBHOOKS_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
            conduit-billing) export BILLING_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test" ;;
          esac
          export INTERNAL_JWT_SECRET="ci-test-secret-not-real"
          export REDIS_URL="redis://localhost:6379"
          export CONDUIT_LEDGER_URL="http://localhost:8002"
          export CONDUIT_RISK_URL="http://localhost:8001"
          export CONDUIT_WEBHOOKS_URL="http://localhost:8003"
          export CONDUIT_BILLING_URL="http://localhost:8004"
          export DASHBOARD_SESSION_SECRET="ci-test-dashboard-secret-not-real"
          if [ -d cmd/migrate ]; then go run ./cmd/migrate; fi
          # -p 1: every package's integration tests share one Postgres
          # database (conduit_test) and one Redis instance. `go test ./...`
          # runs different packages concurrently by default, and two
          # packages' setup TRUNCATEs can interleave and wipe out each
          # other's in-flight rows — -p 1 runs packages one at a time so
          # that can't happen. (Tests within a single package still run
          # sequentially regardless, since none of them call t.Parallel().)
          go test ./... -race -cover -p 1

  # A real Postgres service container, plus a real OPA server (evaluating
  # the actual policies/risk.rego, not a mock) — OPA is started directly via
  # `docker run` in the pytest step below rather than as a `services:`
  # container, since `services:` containers have no way to bind-mount the
  # checked-out policies/ directory into them.
  test-risk-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for pyproject.toml
        id: check
        run: |
          if [ -f "services/conduit-risk/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.12"
      - name: pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: services/conduit-risk
        run: |
          pip install -r requirements.txt
          docker run -d --rm --name opa-ci -p 8282:8181 \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.19.0 run --server --addr :8181 /policies
          for i in $(seq 1 20); do
            curl -sf http://localhost:8282/health && break
            sleep 0.5
          done
          export RISK_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test"
          export INTERNAL_JWT_SECRET="ci-test-secret-not-real"
          export OPA_URL="http://localhost:8282"
          python -m pytest tests/ -v
          docker stop opa-ci

  # A real Postgres service container, plus a real OPA server evaluating
  # policies/dashboard.rego — same "real OPA, started via docker run since
  # services: containers can't bind-mount the checked-out policies/
  # directory" pattern test-risk-service uses for conduit-risk's OPA.
  # CONDUIT_CORE_URL is deliberately left unset here: coreClient.ts's own
  # tests skip cleanly without it (they need the full running stack, which
  # this job doesn't spin up — that level of integration is covered by
  # npm run test:e2e against a real `docker compose up`, run locally/
  # manually rather than on every CI push).
  test-dashboard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check
        run: |
          if [ -f "services/conduit-dashboard/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/conduit-dashboard/package-lock.json
      - name: opa test (native, no server)
        if: steps.check.outputs.exists == 'true'
        working-directory: services/conduit-dashboard
        run: |
          docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.19.0 test /policies
      - name: npm test + build
        if: steps.check.outputs.exists == 'true'
        working-directory: services/conduit-dashboard
        run: |
          docker run -d --rm --name opa-dashboard-ci -p 8283:8181 \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.19.0 run --server --addr :8181 /policies
          for i in $(seq 1 20); do
            curl -sf http://localhost:8283/health && break
            sleep 0.5
          done
          npm ci
          export DASHBOARD_DATABASE_URL="postgres://conduit:conduit@localhost:5432/conduit_test"
          export DASHBOARD_OPA_URL="http://localhost:8283"
          npm run migrate
          npm test
          export AUTH_SECRET="ci-test-auth-secret-not-real"
          export AUTH_GITHUB_ID="ci-placeholder"
          export AUTH_GITHUB_SECRET="ci-placeholder"
          export CONDUIT_CORE_URL="http://ci-placeholder:8000"
          npm run build
          docker stop opa-dashboard-ci
