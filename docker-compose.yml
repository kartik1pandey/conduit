services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit_core
    ports:
      - "5432:5432"
    volumes:
      - conduit_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  conduit-ledger:
    build: ./services/conduit-ledger
    env_file: .env
    environment:
      # .env's *_DATABASE_URL/REDIS_URL point at localhost, for running the
      # binary directly on the host. Inside the compose network, services
      # reach Postgres/Redis by service name instead — override just these keys.
      LEDGER_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_ledger
      REDIS_URL: redis://redis:6379
      CONDUIT_LEDGER_PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  conduit-webhooks:
    build: ./services/conduit-webhooks
    env_file: .env
    environment:
      WEBHOOKS_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_webhooks
      REDIS_URL: redis://redis:6379
      CONDUIT_WEBHOOKS_PORT: "8003"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OPA evaluates policies/risk.rego for conduit-risk — a real sidecar
  # process, not a Python re-implementation of what OPA would decide. See
  # docs/learning for why. The image tag matches the version this project's
  # policy tests were verified against (services/conduit-risk/policies/risk_test.rego).
  opa:
    image: openpolicyagent/opa:1.19.0
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    volumes:
      - ./services/conduit-risk/policies:/policies:ro
    ports:
      - "8181:8181"

  conduit-risk:
    build: ./services/conduit-risk
    env_file: .env
    environment:
      RISK_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_risk
      OPA_URL: http://opa:8181
      CONDUIT_RISK_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started

  conduit-billing:
    build: ./services/conduit-billing
    env_file: .env
    environment:
      BILLING_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_billing
      CONDUIT_BILLING_PORT: "8004"
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy

  conduit-core:
    build: ./services/conduit-core
    env_file: .env
    environment:
      CORE_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_core
      REDIS_URL: redis://redis:6379
      CONDUIT_LEDGER_URL: http://conduit-ledger:8002
      CONDUIT_WEBHOOKS_URL: http://conduit-webhooks:8003
      CONDUIT_RISK_URL: http://conduit-risk:8001
      CONDUIT_BILLING_URL: http://conduit-billing:8004
      CONDUIT_CORE_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      conduit-ledger:
        condition: service_started
      conduit-webhooks:
        condition: service_started
      conduit-risk:
        condition: service_started
      conduit-billing:
        condition: service_started

  # --- Add the remaining service below as it's built. Same shape as above:
  # (conduit-dashboard)

volumes:
  conduit_postgres_data:
