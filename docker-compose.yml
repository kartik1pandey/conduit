services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit_core
    ports:
      - "5432:5432"
    volumes:
      - conduit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Add each service below as it's built (Checkpoints 1.3+). Suggested shape:
  #
  # conduit-core:
  #   build: ./services/conduit-core
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # conduit-ledger:
  #   build: ./services/conduit-ledger
  #   env_file: .env
  #   ports:
  #     - "8002:8002"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # (repeat the pattern for conduit-risk, conduit-webhooks, conduit-billing, conduit-dashboard)

volumes:
  conduit_postgres_data:
