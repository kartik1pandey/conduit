services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit_core
    ports:
      - "5432:5432"
    volumes:
      - conduit_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  conduit-ledger:
    build: ./services/conduit-ledger
    env_file: .env
    environment:
      # .env's LEDGER_DATABASE_URL points at localhost, for running the
      # binary directly on the host. Inside the compose network, services
      # reach Postgres by service name instead — override just this one key.
      LEDGER_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_ledger
      CONDUIT_LEDGER_PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  conduit-core:
    build: ./services/conduit-core
    env_file: .env
    environment:
      CORE_DATABASE_URL: postgres://conduit:conduit@postgres:5432/conduit_core
      CONDUIT_LEDGER_URL: http://conduit-ledger:8002
      CONDUIT_CORE_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      conduit-ledger:
        condition: service_started

  # --- Add each remaining service below as it's built. Same shape as above:
  # (repeat the pattern for conduit-risk, conduit-webhooks, conduit-billing, conduit-dashboard)

volumes:
  conduit_postgres_data:
