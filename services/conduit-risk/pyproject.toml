[project]
name = "conduit-risk"
version = "0.1.0"
description = "AEGIS risk scoring, wrapped as an internal service for CONDUIT."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "httpx>=0.28,<0.29",
    "scikit-learn>=1.9,<2",
    "pandas>=2.3",
    "numpy>=2",
    "joblib>=1.5,<2",
    "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
