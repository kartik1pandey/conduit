# Runs before every commit (installed via `pre-commit install`) and again in
# CI on every PR, so a local skip can't silently slip past review.
#
# Language-specific hooks are scoped to their service directory with `files:`.
# A hook whose pattern matches nothing is skipped entirely (no error) — so the
# Go/Python/Node hooks below are inert until each service actually has source
# files, and start enforcing themselves automatically the day it does.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # Secret scanning — catches committed API keys/credentials before they ever
  # reach GitHub. Non-negotiable for a payments codebase even in test mode.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Go services (conduit-core, conduit-ledger, conduit-webhooks, conduit-billing) ---
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^services/(conduit-core|conduit-ledger|conduit-webhooks|conduit-billing)/.*\.go$
      - id: go-vet
        files: ^services/(conduit-core|conduit-ledger|conduit-webhooks|conduit-billing)/.*\.go$

  # --- Python service (conduit-risk) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^services/conduit-risk/
      - id: ruff-format
        files: ^services/conduit-risk/

  # --- Dashboard (conduit-dashboard, Next.js/TypeScript) ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^services/conduit-dashboard/
